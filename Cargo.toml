[workspace]
members = [
    "crates/dna-core",
    "crates/dna-memory",
    "crates/dna-quality",
    "crates/dna-render",
    "crates/dna-deploy",
    "crates/dna-cli",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
authors = ["MT SOFTWARE"]
repository = "https://github.com/dangermtster-beep/MT-Developer-DNA"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

